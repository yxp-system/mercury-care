# A hardened single-host topology, pending provider selection and deployment acceptance.
# docker compose -f compose.yaml -f deploy/compose.enterprise.yaml config
x-hardened: &hardened
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
  stop_grace_period: 60s
services:
  api:
    <<: *hardened
    environment:
      MERCURY_ENV: production
      MERCURY_SCANNER_MODE: clamav
      MERCURY_WRITES_ENABLED: "false"
    mem_limit: 2g
    cpus: 2
  worker:
    <<: *hardened
    environment:
      MERCURY_ENV: production
      MERCURY_SCANNER_MODE: clamav
      MERCURY_WRITES_ENABLED: "false"
    mem_limit: 2g
    cpus: 2
  web:
    <<: *hardened
    environment:
      MERCURY_COOKIE_SECURE: "true"
      MERCURY_PUBLIC_ORIGIN: ${MERCURY_PUBLIC_ORIGIN:?Set the HTTPS public origin}
    mem_limit: 1g
    cpus: 1
  clamav:
    image: clamav/clamav:1.4.3
    volumes:
      - clamav-signatures:/var/lib/clamav
    expose: ["3310"]
    restart: unless-stopped
    mem_limit: 3g
volumes:
  clamav-signatures:
