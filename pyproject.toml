[project]
name = "mercury-care"
version = "0.2.0"
description = "Auditable after-sales operations with bounded AI collaboration"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary,pool]==3.3.9",
  "pgvector==0.5.1",
  "langgraph==1.2.24",
  "langgraph-checkpoint-postgres==3.2.1",
  "langgraph-checkpoint-sqlite==3.1.3",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.15.1",
  "pwdlib[argon2]==0.4.2",
  "python-multipart>=0.0.20,<0.1",
  "prometheus-client>=0.22,<1",
  "cryptography==50.0.2",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6", "pytest-cov>=6,<8"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api/mercury"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
